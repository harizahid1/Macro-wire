# Refreshes Macro Wire on GitHub's servers, for free, and saves the result back into this repository.
# GitHub Pages then shows the new data.js. Edit the cron line to change how often it runs.
name: Update Macro Wire

on:
  schedule:
    # Monday to Friday at 11:07, 14:07, 17:07, 20:07 and 23:07 UTC (GitHub can start a run a few minutes late)
    - cron: "7 11,14,17,20,23 * * 1-5"
  workflow_dispatch:          # the "Run workflow" button on the Actions tab
  push:
    paths:                    # run again when new local-model reads or a new accuracy test are pushed
      - llm_cache.json
      - llm_grade.json

permissions:
  contents: write             # lets the run save data.js back into the repository

concurrency:
  group: macro-wire-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect, validate, understand, project
        run: python update.py --no-llm

      - name: Show the report on the run page
        if: always()
        run: |
          if [ -f last_report.txt ]; then
            { echo '```'; cat last_report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the work files for 3 days (to look at when something fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-files
          path: work/
          retention-days: 3
          if-no-files-found: ignore

      - name: Save the new data into the repository
        run: |
          git config user.name "macro-wire-bot"
          git config user.email "macro-wire-bot@users.noreply.github.com"
          git add data.js history.jsonl scorecard.json last_report.txt
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Update data"
          git pull --rebase
          git push
